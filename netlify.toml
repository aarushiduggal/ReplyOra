# Repo-root Netlify config.
# The Next.js app lives in the ./replyora-starter subfolder (this repo's root is
# the parent ReplyOra folder). `base` tells Netlify to build from there, so it
# finds package.json, runs `next build`, and applies the Next.js runtime plugin.

[build]
  base = "replyora-starter"
  command = "npm run build"
  # Next's build output (relative to base). Without this, Netlify defaults the
  # publish dir to the base dir, which the Next.js plugin rejects.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
